name: build-and-test

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python deps
        run: python -m pip install -r backend/requirements.txt
      - name: Backend tests
        run: cd backend && python -m unittest discover -s tests
      - name: Frontend build
        run: cd frontend && npm ci --no-audit --no-fund && npm run build

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller
      - name: Build one-folder + .deb
        run: python packaging/build.py --target deb
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xaxglog-linux
          path: |
            dist/Xaxglog/**
            dist/*.deb
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install -r backend/requirements.txt pyinstaller
      - name: Build portable exe (unsigned dev artifact)
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path dist/Xaxglog -DestinationPath dist/Xaxglog-windows.zip
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xaxglog-windows
          path: dist/Xaxglog-windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/xaxglog-linux/**/*.deb
            artifacts/xaxglog-windows/*.zip
          generate_release_notes: true
